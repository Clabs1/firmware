; Family firmware USERPREFS - baked-in private group config for the Family
; Tracker system (Meshtastic base).
;
; Includes: private family channel (PSK+name), EU_868 (UK), 14 dBm TX,
; 120s position broadcast (SPEC §14), TRACKER/CLIENT roles, node names.
;
; NOTE: these are compile-time #ifdefs consumed by src/mesh/Channels.cpp and
; src/mesh/NodeDB.cpp. Each node's build must define the SAME family channel
; PSK/name + region. Per-node identity (names) differs.
;
; Family channel PSK (32 bytes, random). Name: "family".
; base64 import: nSPrLjFanlqBAcgAIp7zvYxYSOrhjhcrYB97/P8qv34=

[family_common]
build_flags =
  -DUSERPREFS_CHANNEL_0_PSK='{0x9d,0x23,0xeb,0x2e,0x31,0x5a,0x9e,0x5a,0x81,0x01,0xc8,0x00,0x22,0x9e,0xf3,0xbd,0x8c,0x58,0x48,0xea,0xe1,0x8e,0x17,0x2b,0x60,0x1f,0x7b,0xfc,0xff,0x2a,0xbf,0x7e}'
  -DUSERPREFS_CHANNEL_0_NAME='"family"'
  -DUSERPREFS_CHANNEL_0_PRECISION=32
  -DUSERPREFS_CHANNELS_TO_WRITE=1
  -DUSERPREFS_FORCE_FAMILY_CHANNEL=1   ; force family channel as PRIMARY on every boot (wipe stale channels)
  -DUSERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_868
  -DUSERPREFS_LORACONFIG_TX_POWER=14
  -DUSERPREFS_CONFIG_POSITION_BROADCAST_INTERVAL=120
  -DUSERPREFS_CONFIG_GPS_UPDATE_INTERVAL=30
  -DUSERPREFS_CONFIG_SMART_POSITION_ENABLED=0
  -DUSERPREFS_CONFIG_GPS_MODE=meshtastic_Config_PositionConfig_GpsMode_ENABLED
  ; Buzzer is ENABLED by default (fresh-install default = ALL_ENABLED). To silence
  ; for automated test runs, re-add:
  ;   -DUSERPREFS_CONFIG_DEVICE_BUZZER_MODE=meshtastic_Config_DeviceConfig_BuzzerMode_DISABLED

; ---------------------------------------------------------------------------
; Family build envs. These EXTEND the stock board envs so no upstream variant
; file is edited (minimal-diff policy). This file is picked up automatically
; by the root platformio.ini extra_configs glob (variants/*/*.ini).
;
;   pio run -e tracker-t1000-e-family        ; child  (T1000-E, TRACKER role)
;   pio run -e heltec-mesh-node-t1-family    ; parent (MeshNode T1, CLIENT role)
;
; Per-node identity (owner names) is set here; edit per device build.
; FAMILY_TEST_HOOKS enables remote test triggers (PANIC_TRIGGER/CONFIG/
; ON_WAY_TRIGGER) used by the hands-off test rig - drop it for field builds.
; ---------------------------------------------------------------------------

[env:tracker-t1000-e-family]
extends = env:tracker-t1000-e
build_flags = ${env:tracker-t1000-e.build_flags}
  ${family_common.build_flags}
  -DUSERPREFS_CONFIG_DEVICE_ROLE=meshtastic_Config_DeviceConfig_Role_TRACKER
  -DUSERPREFS_CONFIG_OWNER_LONG_NAME='"Child 1"'
  -DUSERPREFS_CONFIG_OWNER_SHORT_NAME='"CH1"'
  -DMESHTASTIC_TEST_NO_SLEEP=1
  -DFAMILY_TEST_HOOKS=1

[env:heltec-mesh-node-t1-family]
extends = env:heltec-mesh-node-t1
build_flags = ${env:heltec-mesh-node-t1.build_flags}
  ${family_common.build_flags}
  -DUSERPREFS_CONFIG_DEVICE_ROLE=meshtastic_Config_DeviceConfig_Role_CLIENT
  -DUSERPREFS_CONFIG_OWNER_LONG_NAME='"Parent 1"'
  -DUSERPREFS_CONFIG_OWNER_SHORT_NAME='"PAR1"'
  -DMESHTASTIC_TEST_NO_SLEEP=1
  -DFAMILY_TEST_HOOKS=1
