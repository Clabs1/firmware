; Family firmware USERPREFS - baked-in private group config for the Family
; Tracker system (Meshtastic base).
;
; Includes: private family channel (PSK+name), EU_868 (UK), 14 dBm TX,
; 120s position broadcast (SPEC §14).
;
; NOTE: these are compile-time #ifdefs consumed by src/mesh/Channels.cpp and
; src/mesh/NodeDB.cpp. Each node's build must define the SAME family channel
; PSK/name + region. Per-node role/identity is NOT baked here - it is set at
; provision time via the Meshtastic app/CLI (owner + CLIENT/TRACKER role).
;
; Family channel PSK (32 bytes, random). Name: "family".
; base64 import: nSPrLjFanlqBAcgAIp7zvYxYSOrhjhcrYB97/P8qv34=

[family_common]
build_flags =
  -DUSERPREFS_CHANNEL_0_PSK='{0x9d,0x23,0xeb,0x2e,0x31,0x5a,0x9e,0x5a,0x81,0x01,0xc8,0x00,0x22,0x9e,0xf3,0xbd,0x8c,0x58,0x48,0xea,0xe1,0x8e,0x17,0x2b,0x60,0x1f,0x7b,0xfc,0xff,0x2a,0xbf,0x7e}'
  -DUSERPREFS_CHANNEL_0_NAME='"family"'
  -DUSERPREFS_CHANNEL_0_PRECISION=32
  -DUSERPREFS_CHANNELS_TO_WRITE=1
  -DUSERPREFS_FORCE_FAMILY_CHANNEL=1   ; force family channel as PRIMARY on every boot (wipe stale channels)
  -DUSERPREFS_FAMILY_CANNED_MESSAGES=1 ; bake the T1 canned-message menu to family commands (role-aware)
  -DUSERPREFS_FAMILY_ROLE_TUNING=1    ; role-aware runtime defaults (CLIENT_BASE: GPS refresh 15 min)
  -DUSERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_868
  -DUSERPREFS_LORACONFIG_TX_POWER=14
  -DUSERPREFS_CONFIG_POSITION_BROADCAST_INTERVAL=120
  -DUSERPREFS_CONFIG_GPS_UPDATE_INTERVAL=30
  -DUSERPREFS_CONFIG_SMART_POSITION_ENABLED=0
  -DUSERPREFS_CONFIG_GPS_MODE=meshtastic_Config_PositionConfig_GpsMode_ENABLED
  ; Buzzer ON for family alert tones (panic SOS, come-back, find-sound...).
  ; Base-role nodes still mute generic message/bell tones in module setup().
  -DUSERPREFS_CONFIG_DEVICE_BUZZER_MODE=meshtastic_Config_DeviceConfig_BuzzerMode_ALL_ENABLED
  -DMESHTASTIC_TEST_NO_SLEEP=1

; ---------------------------------------------------------------------------
; Family build envs. Two images - one per hardware type (T1, T1000-E). The
; same image is flashed to every board of that type; role (CLIENT parent /
; TRACKER child) and owner names are assigned per device at provision time via
; the Meshtastic app/CLI (family_common build already carries the private
; channel + region + buzzer default).
;
;   pio run -e heltec-mesh-node-t1-family   ; T1 (both units)
;   pio run -e tracker-t1000-e-family       ; T1000-E (both units)
;
; FAMILY_TEST_HOOKS enables remote test triggers (PANIC_TRIGGER/CONFIG/
; ON_WAY_TRIGGER) used by the hands-off test rig and forces the buzzer off.
; Manual-test/field builds must NOT define it (buzzer comes back on, remote
; triggers disabled). MESHTASTIC_TEST_NO_SLEEP keeps bench units awake.
; ---------------------------------------------------------------------------

[env:heltec-mesh-node-t1-family]
extends = env:heltec-mesh-node-t1
build_flags = ${env:heltec-mesh-node-t1.build_flags}
  ${family_common.build_flags}
  -DMESHTASTIC_TEST_NO_SLEEP=1

[env:tracker-t1000-e-family]
extends = env:tracker-t1000-e
build_flags = ${env:tracker-t1000-e.build_flags}
  ${family_common.build_flags}
  -DMESHTASTIC_TEST_NO_SLEEP=1

; ---------------------------------------------------------------------------
; Debug envs (ENH-009): same images + FAMILY_DEBUG_CHAT - tracker protocol
; events are echoed into family chat with a "[FT] " prefix for field protocol
; testing. NEVER flash these to nodes in normal use (chat fills with [FT] lines).
; ---------------------------------------------------------------------------
[env:heltec-mesh-node-t1-family-debug]
extends = env:heltec-mesh-node-t1-family
build_flags = ${env:heltec-mesh-node-t1-family.build_flags}
  -DFAMILY_DEBUG_CHAT=1

[env:tracker-t1000-e-family-debug]
extends = env:tracker-t1000-e-family
build_flags = ${env:tracker-t1000-e-family.build_flags}
  -DFAMILY_DEBUG_CHAT=1

; ---------------------------------------------------------------------------
; ENH-002 TEMPORARY hardware diagnostic (T1 only): GPS receiver held fully
; powered - no duty-cycling between fixes - while the suspected T1 GPS power-
; management issue is investigated. Mesh/location broadcast cadence is NOT
; changed (still 120 s); only power/sampling behaviour differs. Deliberately
; a separate switch from FAMILY_DEBUG_CHAT: this may stay enabled for weeks.
; Short env name on purpose - long names overflow Windows MAX_PATH in
; .pio/libdeps during SparkFun installs.
; ---------------------------------------------------------------------------
[env:t1gpsdiag]
extends = env:heltec-mesh-node-t1-family
build_flags = ${env:heltec-mesh-node-t1-family.build_flags}
  -DFAMILY_GPS_DIAG=1

; ---------------------------------------------------------------------------
; Phase A rig envs: debug + FAMILY_TEST_HOOKS (remote triggers, buzzer forced
; off). Flash ONLY while running tools/phase_a_test.py, then restore the
; field/debug images. NOTE: deliberately short env names - long names overflow
; Windows MAX_PATH in .pio/libdeps during SparkFun installs.
; ---------------------------------------------------------------------------
[env:t1fh]
extends = env:heltec-mesh-node-t1-family-debug
build_flags = ${env:heltec-mesh-node-t1-family-debug.build_flags}
  -DFAMILY_TEST_HOOKS=1

[env:t1000fh]
extends = env:tracker-t1000-e-family-debug
build_flags = ${env:tracker-t1000-e-family-debug.build_flags}
  -DFAMILY_TEST_HOOKS=1